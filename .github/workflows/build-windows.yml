name: Build and Release Windows Installer

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Clone CellViT Repository
      run: |
        git clone https://github.com/TIO-IKIM/CellViT CellViT

    - name: Clone Patho-SAM runtime repositories
      run: |
        git clone https://github.com/computational-cell-analytics/patho-sam patho-sam
        git clone https://github.com/computational-cell-analytics/micro-sam.git micro-sam
        git clone https://github.com/constantinpape/torch-em.git torch-em
        git clone https://github.com/constantinpape/elf.git elf

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~\AppData\Local\pip\Cache
        key: ${{ runner.os }}-pip-3.11-${{ hashFiles('requirements-windows.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-3.11-

    - name: Cache Cellpose model weights
      uses: actions/cache@v4
      with:
        path: ~\.cellpose\models
        key: cellpose-models-cpsam

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-windows.txt
        pip install pyinstaller

    - name: Install Inno Setup
      run: choco install innosetup -y

    - name: Download Cellpose Models
      run: |
        python -c "from cellpose import models; models.CellposeModel(model_type='cpsam', gpu=False)"

    - name: Build app files with PyInstaller
      run: |
        python -m PyInstaller docs\build\main_release.spec --clean --noconfirm

    - name: Verify PyInstaller output
      run: |
        if (-not (Test-Path "dist\GridAnalyzer\GridAnalyzer.exe")) {
          Write-Error "PyInstaller did not produce dist\GridAnalyzer\GridAnalyzer.exe"
          exit 1
        }
        Write-Host "PyInstaller output OK:"
        Get-ChildItem dist\GridAnalyzer | Select-Object -First 20

    - name: Build Windows installer
      run: |
        New-Item -ItemType Directory -Force -Path "build_installer" | Out-Null
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /Obuild_installer docs\build\installer.iss
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Inno Setup failed with exit code $LASTEXITCODE"
          exit $LASTEXITCODE
        }

    - name: Verify installer output
      run: |
        if (-not (Test-Path "build_installer\GridAnalyzer_Setup.exe")) {
          Write-Error "Inno Setup did not produce build_installer\GridAnalyzer_Setup.exe"
          Get-ChildItem build_installer -ErrorAction SilentlyContinue
          exit 1
        }
        $size = (Get-Item "build_installer\GridAnalyzer_Setup.exe").Length / 1MB
        Write-Host "Installer created: $([math]::Round($size, 1)) MB"

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GridAnalyzer-Windows-Setup
        path: build_installer/
        retention-days: 90

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: build_installer/*
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
