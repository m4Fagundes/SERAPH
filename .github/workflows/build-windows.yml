name: Build and Release Windows Installer

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~\AppData\Local\pip\Cache
        key: ${{ runner.os }}-pip-3.11-${{ hashFiles('requirements-windows.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-3.11-

    - name: Cache Cellpose model weights
      uses: actions/cache@v4
      with:
        path: ~\.cellpose\models
        key: cellpose-models-nuclei-cyto2

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "Pillow>=10.4.0" "openpyxl>=3.1.0" "PyQt6>=6.0.0" "openslide-python>=1.4.0" "openslide-bin>=4.0.0" "cellpose>=4.0,<5.0" "scikit-image>=0.21.0" "opencv-python>=4.8.0" "psutil>=5.9.0" "scipy>=1.11.0" "numpy>=1.26.0" "h5py>=3.10.0"
        pip install torch==2.6.0+cpu torchvision==0.21.0+cpu --index-url https://download.pytorch.org/whl/cpu
        pip install pyinstaller

    - name: Install Inno Setup
      run: choco install innosetup -y

    - name: Download Cellpose Models
      run: |
        python -c "from cellpose import models; models.CellposeModel(model_type='nuclei', gpu=False); models.CellposeModel(model_type='cyto2', gpu=False)"

    - name: Build app files with PyInstaller
      run: |
        python -m PyInstaller docs\build\main_release.spec --clean --noconfirm

    - name: Verify PyInstaller output
      run: |
        if (-not (Test-Path "dist\GridAnalyzer\GridAnalyzer.exe")) {
          Write-Error "PyInstaller did not produce dist\GridAnalyzer\GridAnalyzer.exe"
          exit 1
        }
        Write-Host "PyInstaller output OK:"
        Get-ChildItem dist\GridAnalyzer | Select-Object -First 20

    - name: Build Windows installer
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" docs\build\installer.iss
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Inno Setup failed with exit code $LASTEXITCODE"
          exit $LASTEXITCODE
        }

    - name: Verify installer output
      run: |
        if (-not (Test-Path "build_installer\GridAnalyzer_Setup.exe")) {
          Write-Error "Inno Setup did not produce build_installer\GridAnalyzer_Setup.exe"
          Get-ChildItem build_installer -ErrorAction SilentlyContinue
          exit 1
        }
        $size = (Get-Item "build_installer\GridAnalyzer_Setup.exe").Length / 1MB
        Write-Host "Installer created: $([math]::Round($size, 1)) MB"

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GridAnalyzer-Windows-Setup
        path: build_installer/GridAnalyzer_Setup.exe
        retention-days: 90

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: build_installer/GridAnalyzer_Setup.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
