name: Build and Release Windows Executable

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev,cellpose,vips]
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        pip install pyinstaller

    - name: Cache Cellpose Models
      run: |
        # Download the models to ~/.cellpose/models so PyInstaller can bundle them
        python -c "from cellpose import models; models.CellposeModel(model_type='nuclei', gpu=False); models.CellposeModel(model_type='cyto2', gpu=False)"

    - name: Build with PyInstaller
      run: |
        python -m PyInstaller main.spec --clean --noconfirm

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GridAnalyzer-Windows
        path: dist/GridAnalyzer.exe
        retention-days: 90

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/GridAnalyzer.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}