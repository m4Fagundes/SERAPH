name: Build macOS App

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
    paths:
      - 'app/**'
      - 'main.py'
      - 'requirements-macos.txt'
      - 'docs/build/main_release.spec'
      - 'hooks/rthook_cellpose.py'
      - 'hooks/rthook_openslide.py'
      - 'hooks/rthook_pyvips.py'
      - '.github/workflows/build-macos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-macos.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Cellpose model weights
        uses: actions/cache@v4
        with:
          path: ~/.cellpose/models
          key: cellpose-models-cpsam

      - name: Install Homebrew dependencies
        run: |
          brew install libvips openslide

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-macos.txt
          pip install pyinstaller

      - name: Download Cellpose Models
        run: |
          python -c "from cellpose import models; models.CellposeModel(model_type='cpsam', gpu=False)"

      - name: Build with PyInstaller
        run: |
          pyinstaller --clean --noconfirm docs/build/main_release.spec

      - name: Create DMG
        run: |
          brew install create-dmg || true
          create-dmg \
            --volname "GridAnalyzer" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "GridAnalyzer.app" 200 190 \
            --hide-extension "GridAnalyzer.app" \
            --app-drop-link 400 190 \
            "dist/GridAnalyzer.dmg" \
            "dist/GridAnalyzer.app"
        continue-on-error: true

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: GridAnalyzer-arm64.app
          path: dist/GridAnalyzer.app
          retention-days: 30

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: GridAnalyzer-arm64.dmg
          path: dist/GridAnalyzer.dmg
          retention-days: 30
        continue-on-error: true

      - name: Compress .app to .zip
        run: |
          cd dist
          zip -r GridAnalyzer-macOS.zip GridAnalyzer.app

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GridAnalyzer.dmg
            dist/GridAnalyzer-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
