[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grid-image-analyzer"
version = "1.3.0"
description = "Interactive tool for analyzing and annotating tile grids in microscopy images"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.4.0",
    "openpyxl>=3.1.0",
    "PyQt6>=6.0.0",
    "openslide-python>=1.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
]
vips = [
    "pyvips>=2.2.0",
]
cellpose = [
    "cellpose>=4.0,<5.0",
]

[project.scripts]
grid-analyzer = "main:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Ruff — linter + formatter (substitui flake8 + isort + pyupgrade + black)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "W",   # pycodestyle warnings
]
ignore = [
    "E501",  # line too long — handled by formatter
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Mypy — type checking (não-estrito; progressivo)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
